name: docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'scripts/check-docs-site.sh'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'scripts/check-docs-site.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      # The README index table depends only on sidebars.ts and docs/, so a stale
      # one is a real failure. The changelog is built from git log and always lags
      # the commit that generates it, so only its idempotency is asserted.
      - name: Generated files
        run: |
          npm run gen
          git diff --exit-code -- README.md
          sha256sum ../docs/history/changelog.md ../README.md > /tmp/gen-a
          npm run gen
          sha256sum ../docs/history/changelog.md ../README.md > /tmp/gen-b
          diff /tmp/gen-a /tmp/gen-b

      - run: npm run typecheck
      - run: npm run build

      - name: Docs gate
        run: bash ../scripts/check-docs-site.sh --site . --docs ../docs --repo-root ..

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
